[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "net-bandit"
version = "0.1.0"
description = "net-bandit: host intrusion detection agent with a compiled-judgment cache, adaptive spot-checking and Claude API fallback (Windows-native collectors)"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
net-bandit = "net_bandit.cli:main"

[tool.setuptools]
packages = ["net_bandit", "net_bandit.win"]
